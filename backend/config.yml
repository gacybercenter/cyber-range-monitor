app:
  config_label: docker
  environment: container
  mode: dev
  env_file: .env
  debug: true
  testing: false
  min_log_level: INFO
  console_enabled: true
documentation:
  allowed: true
cors:
  allow_orgins:
  - '*'
  allow_methods:
  - '*'
  allow_headers:
  - '*'
  allow_credentials: true
database:
  url: sqlite+aiosqlite:///instance/app.db
  journal_mode: WAL
  timeout: 30
  busy_timeout: 30
  sqlalchemy_echo: true
redis:
  host: range_monitor_redis
  port: 6379
  db: 0
