app:
  config_label: dev
  environment: local
  mode: dev
  env_file: .env
  debug: true
  testing: false
  min_log_level: INFO
  console_enabled: true
documentation:
  allowed: true
cors:
  allow_orgins:
  - '*'
  allow_methods:
  - '*'
  allow_headers:
  - '*'
  allow_credentials: true
database:
  url: sqlite+aiosqlite:///instance/app.db
  journal_mode: WAL
  timeout: 30
  busy_timeout: 30
  sqlalchemy_echo: true
redis:
  host: localhost
  port: 6379
  db: 0
auth:
  cookie_secure: false
  cookie_http_only: true
  cookie_samesite: lax
  cookie_exp_hours: 1
  key_max_age_days: 1
