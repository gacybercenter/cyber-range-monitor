app:
    label: dev
    debug: true
    env_file: .env
    test: false
    allow_documentation: true

cors:
    allow_origins:
        - "*"
    allow_methods:
        - "*"
    allow_headers:
        - "*"
    allow_credentials: true

redis:
    host: localhost
    port: 6379
    db: 0
    use_password: false

database:
    file_name: app.db
    timeout: 30
    directory: instance
    echo: true
    run_seed: false

logs:
    use_rich: true
    max_file_mb: 5
    uvicorn_audit: true
    log_levels:
        default: DEBUG
        uvicorn: INFO
        stdout: DEBUG
        file: INFO
    websocket_enabled: true
    websocket_loggers:
        - security
        - error
        - uvicorn.access
