[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitor-api"
version = "0.1.0"
description = "An opensource API built with FastAPI to manage and monitor with support for Guacamole, Openstack and Saltstack datasources developed by the Georgia Cyber Range"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "asgi-correlation-id>=4.3.4",
    "bcrypt==4.0.1",
    "cryptography>=44.0.1",
    "fastapi[all]>=0.115.8",
    "guacamole-api-wrapper>=0.1.0",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "msgspec>=0.19.0",
    "openstacksdk>=4.4.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.8.0",
    "pytest-cov>=6.0.0",
    "python-jose[cryptography]>=3.5.0",
    "redis[hiredis]>=5.2.1",
    "sqlalchemy>=2.0.38",
    "sqlparse>=0.5.3",
    "toml>=0.10.1",
    "user-agents>=2.2.0",
]

[project.scripts]
api = "cli.build:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "coverage>=7.6.12",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.9",
    "schemathesis>=3.39.11",
]

[tool.ruff]
target-version = "py312"
exclude=[
    "cli",
    "scripts",
    "tests"
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflake
    "I", # isort
    "UP", # upgrade
    "B", # flake-bugbear
    "C4", # flake8-comprehensions
]

ignore=[
    "E501",
    "W191", # indentation contains tabs
    "B904", # allow raising exceptions without from e for HTTPExceptions
    "B008", # do not perform function calls in argument defaults (fastapi depends)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions=["test_*"]
asyncio_mode = "auto"
addopts = [
    "--cov=app",
    "--cov-report=term",
    "--cov-report=html:coverage_html_report"
]

log_cli=true
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filter_warnings = [
    "error",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning"
]
showlocals = true
markers = [
    "unit: mark test as unit test",
    "integration: mark test as integration"
]

