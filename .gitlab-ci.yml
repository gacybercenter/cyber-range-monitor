stages:
  - uv-cache
  - sync-lock
  - lint

variables:
  UV_VERSION: 0.6.3
  PYTHON_VERSION: 3.12
  BASE_LAYER: bookworm-slim
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  REDIS_HOST: redis
  REDIS_PORT: 6379
  GIT_DEPTH: 50

default:
  tags:
    - docker-gcc

.backend-base:
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  before_script:
    - cd backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA
      when: always
      changes:
        - backend/**/*

    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      changes:
        - backend/**/*

    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

uv-cache:
  stage: uv-cache
  extends: .backend-base
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - ${UV_CACHE_DIR}
    policy: pull-push
  script: |
    uv cache prune --ci

sync-lock:
  stage: sync-lock
  extends: .backend-base
  artifacts:
    paths:
      - backend/uv.lock
    expire_in: 1 week

  script: |
    uv sync
    uv lock

lint:
  stage: lint
  extends: .backend-base
  needs:
    - sync-lock

  script: |
    set -ex
    uvx ruff check range_monitor

 